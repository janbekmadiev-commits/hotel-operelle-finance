<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HOTEL.OPERELLE — система управления гостиничным комплексом</title>
<style>
:root{
  --bg:#0A0F1A;
  --panel:#0E1626;
  --card:#131E33;
  --card-2:#17253E;
  --line:#22314F;
  --line-soft:#1B2740;
  --txt:#E8EEF9;
  --txt-2:#9DB0CE;
  --txt-3:#6D809F;
  --gold:#C9A227;
  --green:#22C55E;
  --blue:#3B82F6;
  --amber:#F59E0B;
  --red:#EF4444;
  --violet:#A855F7;
  --cyan:#06B6D4;
  --slate:#64748B;
  --r:12px;
  --r-sm:8px;
  --shadow:0 10px 30px rgba(0,0,0,.35);
  --mono:'SF Mono',ui-monospace,'Cascadia Mono','Roboto Mono',Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--txt);
  font-family:'Inter','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;
  font-size:14px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
  font-variant-numeric:tabular-nums;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
a{color:inherit;text-decoration:none}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#22314F;border-radius:8px;border:2px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:#2E4062}

/* ---------- layout ---------- */
.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
.sidebar{
  background:var(--panel);border-right:1px solid var(--line-soft);
  position:sticky;top:0;height:100vh;display:flex;flex-direction:column;
}
.brand{display:flex;align-items:center;gap:11px;padding:18px 18px 16px;border-bottom:1px solid var(--line-soft)}
.brand-mark{
  width:36px;height:36px;border-radius:10px;flex:0 0 36px;
  background:linear-gradient(145deg,#C9A227,#8C6F17);
  display:grid;place-items:center;color:#1A1405;font-weight:800;font-size:15px;letter-spacing:-.5px;
}
.brand-name{font-weight:700;letter-spacing:.5px;font-size:14px}
.brand-sub{font-size:10px;color:var(--txt-3);letter-spacing:1.6px;text-transform:uppercase;margin-top:1px}
.nav{padding:10px 10px 20px;overflow-y:auto;flex:1}
.nav-group{margin:14px 8px 6px;font-size:10px;letter-spacing:1.4px;text-transform:uppercase;color:var(--txt-3);font-weight:600}
.nav-item{
  display:flex;align-items:center;gap:11px;width:100%;padding:9px 11px;border-radius:9px;
  color:var(--txt-2);font-size:13.5px;text-align:left;transition:.15s;position:relative;
}
.nav-item:hover{background:#16233A;color:var(--txt)}
.nav-item.active{background:#1B2C4A;color:#fff;font-weight:600}
.nav-item.active::before{content:'';position:absolute;left:0;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:var(--gold)}
.nav-item svg{width:17px;height:17px;flex:0 0 17px;opacity:.85}
.nav-badge{margin-left:auto;background:#2A3A5C;color:#BFD0EC;font-size:10.5px;padding:1px 7px;border-radius:20px;font-weight:600}
.nav-badge.alert{background:rgba(239,68,68,.18);color:#FCA5A5}
.sidebar-foot{padding:12px;border-top:1px solid var(--line-soft)}
.ai-status{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line-soft);border-radius:10px;padding:10px 11px}
.ai-dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px rgba(34,197,94,.15)}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{
  position:sticky;top:0;z-index:40;background:rgba(10,15,26,.9);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line-soft);padding:12px 22px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;
}
.page-title{font-size:19px;font-weight:700;letter-spacing:-.2px}
.page-sub{font-size:12px;color:var(--txt-3);margin-top:1px}
.search{
  margin-left:auto;display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);
  border-radius:9px;padding:7px 12px;min-width:230px;color:var(--txt-3)
}
.search input{background:none;border:none;outline:none;width:100%;color:var(--txt);font-size:13px}
.date-chip{display:flex;flex-direction:column;line-height:1.25;padding:4px 12px;border-left:1px solid var(--line);border-right:1px solid var(--line)}
.date-chip b{font-size:13px}
.date-chip span{font-size:11px;color:var(--txt-3)}
.role-switch{display:flex;background:var(--card);border:1px solid var(--line);border-radius:9px;padding:3px;gap:2px}
.role-switch button{padding:6px 12px;border-radius:7px;font-size:12.5px;color:var(--txt-2);white-space:nowrap}
.role-switch button.on{background:var(--gold);color:#1A1405;font-weight:700}
.icon-btn{width:36px;height:36px;border-radius:9px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;position:relative;color:var(--txt-2)}
.icon-btn:hover{color:var(--txt);border-color:#31456B}
.icon-btn .dot{position:absolute;top:6px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--red)}
.user-chip{display:flex;align-items:center;gap:9px}
.avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(145deg,#2E4062,#1B2740);display:grid;place-items:center;font-weight:700;font-size:12px;color:#C6D6F2;border:1px solid var(--line)}
.view{padding:20px 22px 40px;flex:1}

/* ---------- primitives ---------- */
.grid{display:grid;gap:14px}
.g-kpi{grid-template-columns:repeat(auto-fit,minmax(178px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.g-main{grid-template-columns:minmax(0,2.1fr) minmax(0,1fr)}
.card{background:var(--card);border:1px solid var(--line-soft);border-radius:var(--r);padding:16px}
.card-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.card-title{font-weight:650;font-size:14.5px}
.card-actions{margin-left:auto;display:flex;gap:8px;align-items:center}
.muted{color:var(--txt-3)}
.small{font-size:12px}
.label{font-size:10.5px;letter-spacing:1.2px;text-transform:uppercase;color:var(--txt-3);font-weight:600}
.kpi-val{font-size:26px;font-weight:700;letter-spacing:-.6px;line-height:1.1;margin:6px 0 2px}
.kpi-ico{width:34px;height:34px;border-radius:9px;display:grid;place-items:center}
.delta{font-size:11.5px;font-weight:600}
.delta.up{color:var(--green)} .delta.down{color:var(--red)}
.btn{
  display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:9px;font-size:13px;font-weight:600;
  background:var(--card-2);border:1px solid var(--line);color:var(--txt);transition:.15s;white-space:nowrap
}
.btn:hover{border-color:#3A5286;background:#1D2E4D}
.btn-p{background:var(--blue);border-color:var(--blue);color:#fff}
.btn-p:hover{background:#2563EB;border-color:#2563EB}
.btn-g{background:var(--green);border-color:var(--green);color:#04240F}
.btn-g:hover{background:#16A34A;border-color:#16A34A}
.btn-gold{background:var(--gold);border-color:var(--gold);color:#1A1405}
.btn-gold:hover{background:#B8931F}
.btn-ghost{background:transparent}
.btn-sm{padding:5px 10px;font-size:12px;border-radius:7px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;font-size:11.5px;font-weight:600;white-space:nowrap}
.b-green{background:rgba(34,197,94,.15);color:#6EE7A0}
.b-blue{background:rgba(59,130,246,.16);color:#93B8FB}
.b-amber{background:rgba(245,158,11,.15);color:#FBD38D}
.b-red{background:rgba(239,68,68,.15);color:#FCA5A5}
.b-violet{background:rgba(168,85,247,.16);color:#D8B4FE}
.b-slate{background:rgba(100,116,139,.2);color:#B4C2D6}
.b-cyan{background:rgba(6,182,212,.16);color:#7DD8E8}
table{width:100%;border-collapse:collapse}
th{
  text-align:left;font-size:10.5px;letter-spacing:1px;text-transform:uppercase;color:var(--txt-3);
  font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line-soft);white-space:nowrap
}
td{padding:10px;border-bottom:1px solid var(--line-soft);font-size:13px;vertical-align:middle}
tbody tr:hover td{background:rgba(255,255,255,.02)}
tbody tr:last-child td{border-bottom:none}
.tbl-wrap{overflow-x:auto;margin:0 -16px -16px;padding:0 16px 4px}
.row{display:flex;align-items:center;gap:10px}
.row-between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.stack{display:flex;flex-direction:column;gap:10px}
.list-row{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px solid var(--line-soft)}
.list-row:last-child{border-bottom:none}
.dot-ico{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex:0 0 30px;font-size:13px}
.progress{height:6px;border-radius:6px;background:#1B2740;overflow:hidden}
.progress i{display:block;height:100%;border-radius:6px;background:var(--green)}
/* ---------- шахматка / таймлайн ---------- */
.tl{border:1px solid var(--line-soft);border-radius:10px;overflow:hidden;background:var(--panel)}
.tl-head,.tl-line{display:grid;grid-template-columns:104px 1fr;align-items:stretch}
.tl-head{background:var(--card-2);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.tl-corner{padding:7px 9px;font-size:10.5px;letter-spacing:1px;text-transform:uppercase;color:var(--txt-3);font-weight:600;
  display:flex;align-items:center;border-right:1px solid var(--line)}
.tl-days,.tl-track{display:grid;grid-template-columns:repeat(var(--n),minmax(30px,1fr))}
.tl-day{padding:5px 2px;text-align:center;font-size:10.5px;color:var(--txt-2);border-left:1px solid var(--line-soft);line-height:1.25}
.tl-day.we{background:rgba(239,68,68,.07);color:#FCA5A5}
.tl-day.now{background:rgba(59,130,246,.18);color:#BFD8FF;font-weight:700}
.tl-day b{display:block;font-size:12px}
.tl-line{border-bottom:1px solid var(--line-soft);min-height:30px}
.tl-line:last-child{border-bottom:none}
.tl-line:hover{background:rgba(255,255,255,.02)}
.tl-room{padding:5px 9px;border-right:1px solid var(--line);display:flex;flex-direction:column;justify-content:center;gap:1px}
.tl-room b{font-size:12.5px}
.tl-room span{font-size:9.5px;color:var(--txt-3)}
.tl-track{position:relative;padding:3px 0}
.tl-slot{grid-row:1;border-left:1px solid var(--line-soft);display:block;min-height:24px}
.tl-slot.we{background:rgba(239,68,68,.05)}
.tl-slot.now{background:rgba(59,130,246,.1)}
.tl-bar{grid-row:1;z-index:2;border-radius:6px;font-size:10.5px;font-weight:600;padding:0 7px;display:flex;align-items:center;
  overflow:hidden;white-space:nowrap;text-overflow:ellipsis;cursor:pointer;margin:0 1px;min-height:24px;transition:.12s}
.tl-bar:hover{filter:brightness(1.18);transform:translateY(-1px)}
.bar-stay{background:rgba(59,130,246,.85);color:#EAF2FF}
.bar-book{background:rgba(245,158,11,.8);color:#2A1A02}
.bar-past{background:rgba(100,116,139,.5);color:#D8E1EE}
.bar-out{background:rgba(239,68,68,.75);color:#fff}
/* календарь месяца */
.cal-h,.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal-h div{text-align:center;font-size:10.5px;letter-spacing:1px;text-transform:uppercase;color:var(--txt-3);font-weight:600;padding-bottom:2px}
.cal-day{border:1px solid var(--line-soft);border-radius:9px;padding:7px 8px;min-height:78px;background:var(--panel);cursor:pointer;transition:.12s}
.cal-day:hover{border-color:#3A5286;transform:translateY(-1px)}
.cal-day.out{opacity:.32;cursor:default}
.cal-day.now{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
.cal-day .d{font-size:13px;font-weight:700}
.cal-day .o{font-size:11px;color:var(--txt-2);margin-top:2px}
.cal-day .f{font-size:11px;font-weight:600;margin-top:1px}
.cal-day .bar{height:4px;border-radius:4px;background:#1B2740;margin-top:6px;overflow:hidden}
.cal-day .bar i{display:block;height:100%}
/* год */
.yr-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.yr-card{border:1px solid var(--line-soft);border-radius:10px;padding:11px;background:var(--panel);cursor:pointer;transition:.12s}
.yr-card:hover{border-color:#3A5286;transform:translateY(-1px)}
.yr-card.now{border-color:var(--gold)}
.tabs{display:flex;gap:4px;background:var(--panel);border:1px solid var(--line-soft);padding:4px;border-radius:10px;overflow-x:auto}
.tabs button{padding:7px 13px;border-radius:7px;font-size:12.5px;color:var(--txt-2);white-space:nowrap}
.tabs button.on{background:var(--card-2);color:#fff;font-weight:600}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:11px;color:var(--txt-3);font-weight:600;letter-spacing:.4px}
.field input,.field select,.field textarea{
  background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px 11px;outline:none;font-size:13px;width:100%
}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--blue)}
.field input[readonly]{color:var(--txt-2)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{padding:7px 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel);font-size:12.5px;color:var(--txt-2)}
.seg button.on{border-color:var(--blue);background:rgba(59,130,246,.14);color:#BFD8FF;font-weight:600}
.chk{display:flex;align-items:center;gap:9px;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--panel);cursor:pointer;font-size:13px}
.chk.on{border-color:var(--green);background:rgba(34,197,94,.08)}
.chk .box{width:17px;height:17px;border-radius:5px;border:1.5px solid var(--line);display:grid;place-items:center;flex:0 0 17px;font-size:11px;color:#04240F}
.chk.on .box{background:var(--green);border-color:var(--green)}
.empty{padding:34px;text-align:center;color:var(--txt-3);font-size:13px}
.divider{height:1px;background:var(--line-soft);margin:14px 0}

/* ---------- room map ---------- */
.floor{display:flex;gap:12px;align-items:flex-start;margin-bottom:12px}
.floor-label{width:58px;flex:0 0 58px;font-size:11.5px;color:var(--txt-3);padding-top:9px;font-weight:600}
.rooms{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:7px;flex:1}
.room{
  padding:9px 4px;border-radius:8px;text-align:center;font-size:12.5px;font-weight:650;
  border:1px solid transparent;transition:.12s;position:relative
}
.room:hover{transform:translateY(-2px);filter:brightness(1.18)}
.room.sel{outline:2px solid #fff;outline-offset:1px}
.r-free{background:rgba(34,197,94,.16);color:#7EE8AC;border-color:rgba(34,197,94,.3)}
.r-occupied{background:rgba(59,130,246,.16);color:#9CC0FC;border-color:rgba(59,130,246,.3)}
.r-cleaning{background:rgba(245,158,11,.17);color:#FBD38D;border-color:rgba(245,158,11,.3)}
.r-repair{background:rgba(239,68,68,.16);color:#FCA5A5;border-color:rgba(239,68,68,.3)}
.r-vip{background:rgba(168,85,247,.17);color:#DDB6FE;border-color:rgba(168,85,247,.3)}
.r-blocked{background:rgba(100,116,139,.18);color:#AEBACC;border-color:rgba(100,116,139,.3)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--txt-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:9px;height:9px;border-radius:3px;display:inline-block}

/* ---------- modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(4,8,15,.72);backdrop-filter:blur(3px);z-index:100;display:grid;place-items:center;padding:20px;animation:fade .18s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{
  background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);
  width:min(920px,100%);max-height:90vh;display:flex;flex-direction:column;animation:pop .2s ease
}
.modal.wide{width:min(1120px,100%)}
.modal.narrow{width:min(560px,100%)}
@keyframes pop{from{transform:translateY(12px) scale(.98);opacity:0}to{transform:none;opacity:1}}
.modal-head{display:flex;align-items:center;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line-soft)}
.modal-body{padding:18px;overflow-y:auto}
.modal-foot{padding:14px 18px;border-top:1px solid var(--line-soft);display:flex;gap:10px;align-items:center;justify-content:flex-end}
.stepper{display:flex;gap:6px;padding:0 18px 14px}
.step{flex:1;display:flex;flex-direction:column;gap:6px}
.step i{height:3px;border-radius:3px;background:#22314F;display:block}
.step.done i{background:var(--green)} .step.on i{background:var(--blue)}
.step span{font-size:10.5px;color:var(--txt-3);letter-spacing:.3px}
.step.on span{color:#BFD8FF;font-weight:600}
.step.done span{color:#7EE8AC}

/* ---------- toast ---------- */
#toast-root{position:fixed;right:20px;bottom:20px;z-index:200;display:flex;flex-direction:column;gap:9px;max-width:360px}
.toast{
  background:var(--card-2);border:1px solid var(--line);border-left:3px solid var(--green);border-radius:10px;
  padding:12px 14px;box-shadow:var(--shadow);animation:slide .22s ease;font-size:13px
}
.toast.info{border-left-color:var(--blue)} .toast.warn{border-left-color:var(--amber)} .toast.err{border-left-color:var(--red)}
@keyframes slide{from{transform:translateX(24px);opacity:0}to{transform:none;opacity:1}}

/* ---------- clicker / mirror ---------- */
.mirror{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.screen{background:#0A1120;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.screen-bar{background:#182A47;padding:7px 11px;font-size:12px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line)}
.screen-body{padding:14px;min-height:230px}
.cn{font-family:'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif}
.cn-btn{background:#1F3355;border:1px solid #2E4A79;border-radius:6px;padding:7px 12px;font-size:13px;display:inline-block;margin:3px 4px 3px 0}
.cn-btn.hi{background:#2563EB;border-color:#2563EB;color:#fff;box-shadow:0 0 0 3px rgba(37,99,235,.25)}
.cursor{position:absolute;width:14px;height:14px;pointer-events:none;transition:.35s cubic-bezier(.4,0,.2,1)}
.log{font-family:var(--mono);font-size:11.5px;background:#080D18;border:1px solid var(--line-soft);border-radius:9px;padding:11px;max-height:190px;overflow-y:auto;line-height:1.7}
.log .t{color:var(--txt-3)}
.log .ok{color:#6EE7A0} .log .warn{color:#FBD38D} .log .inf{color:#93B8FB}

/* ---------- document preview ---------- */
.doc{background:#F7F7F4;color:#1a1a1a;border-radius:8px;padding:26px 28px;font-family:'Times New Roman',Georgia,serif;font-size:13px;line-height:1.6}
.doc h3{margin:0 0 4px;font-size:16px;text-align:center;letter-spacing:.5px}
.doc .doc-sub{text-align:center;color:#555;font-size:12px;margin-bottom:16px}
.doc table{border-collapse:collapse;margin:10px 0}
.doc td,.doc th{border:1px solid #bbb;padding:5px 8px;font-size:12px;color:#1a1a1a}
.doc th{background:#eceae4;text-transform:none;letter-spacing:0;color:#1a1a1a}
.doc .sign{display:flex;justify-content:space-between;margin-top:26px;font-size:12px}
.doc .stamp{margin-top:16px;font-size:11px;color:#777;border-top:1px dashed #bbb;padding-top:8px}

/* ---------- misc ---------- */
.tile{background:var(--card-2);border:1px solid var(--line-soft);border-radius:10px;padding:12px}
.tile.click{cursor:pointer;transition:.15s}
.tile.click:hover{border-color:#3A5286;transform:translateY(-1px)}
.slot{padding:7px 4px;border-radius:7px;font-size:11.5px;text-align:center;border:1px solid var(--line-soft);background:var(--panel);cursor:pointer}
.slot.busy{background:rgba(59,130,246,.14);border-color:rgba(59,130,246,.3);color:#9CC0FC;cursor:default}
.slot.free:hover{border-color:var(--green);color:#7EE8AC}
.slot.sel{background:var(--green);color:#04240F;border-color:var(--green);font-weight:700}
.hbar{height:8px;border-radius:8px;background:#1B2740;overflow:hidden;display:flex}
.hbar i{display:block;height:100%}
.mini{font-size:11.5px;color:var(--txt-3)}
.alert-row{display:flex;gap:11px;padding:11px;border-radius:10px;background:var(--card-2);border:1px solid var(--line-soft);align-items:flex-start}
.alert-row.crit{border-left:3px solid var(--red)}
.alert-row.warn{border-left:3px solid var(--amber)}
.alert-row.info{border-left:3px solid var(--blue)}
.pill-tab{padding:5px 11px;border-radius:20px;border:1px solid var(--line);font-size:12px;color:var(--txt-2)}
.pill-tab.on{background:var(--card-2);border-color:#3A5286;color:#fff;font-weight:600}
.kv{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px dashed var(--line-soft);font-size:13px}
.kv:last-child{border-bottom:none}
.kv b{font-weight:600}
.scroll-x{overflow-x:auto}
.nowrap{white-space:nowrap}

@media (max-width:1180px){
  .g-main{grid-template-columns:1fr}
  .rooms{grid-template-columns:repeat(5,minmax(0,1fr))}
}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .sidebar{position:fixed;left:0;top:0;width:250px;z-index:90;transform:translateX(-100%);transition:.25s}
  .sidebar.open{transform:none;box-shadow:var(--shadow)}
  .burger{display:grid !important}
  .topbar{padding:10px 14px}
  .view{padding:14px}
  .search{display:none}
  .mirror{grid-template-columns:1fr}
  .role-switch button{padding:6px 9px;font-size:11.5px}
}
.burger{display:none}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}

/* ============ ФИНАНСЫ И УЧЁТ: дополнения к оформлению дашборда ============ */
.r,th.r{text-align:right}
td.r{font-variant-numeric:tabular-nums;white-space:nowrap}
.clk{cursor:pointer}
tr.clk:hover td{background:rgba(59,130,246,.08)}
.card.clk:hover,.alert-row.clk:hover{border-color:#3A5286}
.kv.sum{border-top:1px solid var(--line);border-bottom:none;margin-top:2px;padding-top:9px}
.kv.sum span{font-weight:600;color:var(--txt)}
.kv b{text-align:right}
.fcols{display:flex;gap:6px;align-items:flex-end}
.fcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;min-width:0}
.fbars{flex:1;width:100%;display:flex;gap:3px;align-items:flex-end;justify-content:center}
.fbars i{display:block;width:42%;max-width:20px;border-radius:3px 3px 0 0}
.fcol span{font-size:10.5px;color:var(--txt-3)}
.fstrip{display:flex;gap:4px;overflow-x:auto;padding-bottom:4px}
.fday{flex:0 0 36px;height:46px;border-radius:8px;border:1px solid var(--line-soft);background:var(--card);display:grid;place-items:center;align-content:center;gap:4px;color:var(--txt)}
.fday b{font-size:13px;font-weight:600}
.fday i{width:7px;height:7px;border-radius:50%;background:var(--green)}
.fday.bad i{background:var(--red)}.fday.fix i{background:var(--amber)}.fday.none i{background:var(--slate)}.fday.own i{background:var(--blue)}
.fday.on{border-color:var(--gold);background:var(--card-2)}
tr.fbad td{background:rgba(239,68,68,.07)}
.fta{width:100%;min-height:120px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px 10px;font:12px/1.45 var(--mono);color:var(--txt);resize:vertical;white-space:pre;overflow:auto;outline:none}
.fta:focus{border-color:var(--blue)}
.tabs{flex-wrap:nowrap}
.modal .g-kpi{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
@media print{
  :root{--bg:#fff;--panel:#fff;--card:#fff;--card-2:#fff;--txt:#111;--txt-2:#333;--txt-3:#555;--line:#999;--line-soft:#ccc}
  .sidebar,.topbar,.tabs,.seg,.btn,#toast-root,.fstrip,.fta{display:none !important}
  .app{display:block}.view{padding:0}.card{break-inside:avoid;border-color:#ccc}
  body:has(#modal-root .modal) .app{display:none}
  #modal-root .overlay{position:static !important;background:none !important;padding:0 !important;display:block !important}
  #modal-root .modal{width:auto !important;max-height:none !important;border:0 !important;box-shadow:none !important;background:#fff !important}
  #modal-root .modal-head,#modal-root .modal-foot{display:none !important}
}
/* узкие экраны: содержимое карточек не должно распирать сетку — таблицы прокручиваются внутри карточки */
.grid > *{min-width:0}
@media (max-width:1180px){.g-main{grid-template-columns:minmax(0,1fr)}}
@media (max-width:860px){
  .kv{font-size:12.5px}.kv b{max-width:58%}
  .modal .modal-body{padding:14px 12px}
  .fday{flex-basis:38px;height:48px}
}
/* окна карточек: не шире экрана, таблицы прокручиваются внутри */
.modal{min-width:0;max-width:100%}
.modal-body{min-width:0;overflow-x:hidden}
.modal .tbl-wrap{margin:0;padding:0 0 4px}
.modal .grid.g2{grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr))}
.modal-foot{flex-wrap:wrap}
@media (max-width:860px){.overlay{padding:8px !important}.modal .g-kpi{grid-template-columns:repeat(2,minmax(0,1fr))}.modal-head .mini{white-space:normal}}

<body>

        <svg viewBox="0 0 24 24" width="15" height="15" fill="currentColor"><path d="M10 2a8 8 0 1 0 4.9 14.3l5.4 5.4 1.4-1.4-5.4-5.4A8 8 0 0 0 10 2zm0 2a6 6 0 1 1 0 12 6 6 0 0 1 0-12z"/></svg>

    </header>
    <div class="view" id="view"></div>
  </div>
</div>
<div id="modal-root"></div>
<div id="toast-root"></div>
<script>
/* ============================================================
   HOTEL.OPERELLE — демо-прототип на данных из ТЗ v2.0
   Ядро: OPERELLE · агенты: DURUS.AI · контроль: CHIMERA
   ============================================================ */

/* ---------- иконки ---------- */
const ICONS={
 dashboard:'<path d="M3 3h8v8H3zM13 3h8v5h-8zM13 10h8v11h-8zM3 13h8v8H3z"/>',
 reception:'<path d="M8 2h8v2h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2V2zm0 8h8v2H8zm0 4h6v2H8z"/>',
 booking:'<path d="M7 2v2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2h-2V2h-2v2H9V2H7zM5 9h14v11H5z"/>',
 rooms:'<path d="M3 7h2v5h7V8h5a4 4 0 0 1 4 4v6h-2v-3H5v3H3V7z"/>',
 guests:'<path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zm0 2c-4.4 0-8 2.2-8 5v1h16v-1c0-2.8-3.6-5-8-5z"/>',
 housekeeping:'<path d="M11 2h2v6h-2zM7 9h10l1 4H6zM6 15h12l-1 7H7z"/>',
 restaurant:'<path d="M6 2v8a2 2 0 0 0 2 2v10h2V12a2 2 0 0 0 2-2V2h-1.5v6h-1V2H8v6H7V2H6zm11 0c-1.7 1.2-2.5 3.3-2.5 6.5 0 2 .9 3.2 2 3.5V22h2V2h-1.5z"/>',
 kitchen:'<path d="M12 2a7 7 0 0 0-7 7v3h14V9a7 7 0 0 0-7-7zM5 14h14l-1 8H6z"/>',
 pool:'<path d="M12 2s6.5 7 6.5 11.5a6.5 6.5 0 1 1-13 0C5.5 9 12 2 12 2z"/>',
 spa:'<path d="M12 3c2 2.2 3 4.2 3 6.2s-1 3.6-3 5c-2-1.4-3-3-3-5S10 5.2 12 3zM4.2 12.2c2.5-.7 4.6 0 6.1 1.7-1.5 1.7-3.6 2.3-6.1 1.6a5 5 0 0 1 0-3.3zm15.6 0a5 5 0 0 1 0 3.3c-2.5.7-4.6.1-6.1-1.6 1.5-1.7 3.6-2.4 6.1-1.7zM12 22c-1.5-2-2-3.6-2-5.1h4c0 1.5-.5 3.1-2 5.1z"/>',
 services:'<path d="M12 2l2.5 5.2 5.7.8-4.1 4 1 5.7L12 15l-5.1 2.7 1-5.7-4.1-4 5.7-.8z"/>',
 laundry:'<path d="M6 2h12l-2 4H8L6 2zm-1 6h14v14H5V8zm7 2.5a4.5 4.5 0 1 0 0 9 4.5 4.5 0 0 0 0-9z"/>',
 warehouse:'<path d="M3 9l9-5 9 5v12h-6v-6H9v6H3V9z"/>',
 engineering:'<path d="M20.7 5.3l-3.1 3.1-2-2 3.1-3.1a5.5 5.5 0 0 0-7.2 6.9L3 19.7 5.3 22l8.5-8.5a5.5 5.5 0 0 0 6.9-8.2z"/>',
 grid:'<path d="M3 4h18v3.5H3zM3 10h8v4H3zm10 0h8v4h-8zM3 16.5h18V20H3z"/>',
 keys:'<path d="M14 2a6 6 0 1 0-5.7 8L3 15.3V21h5.4l1.6-1.6V17h2v-2h1.6l1-1A6 6 0 0 0 14 2zm2.2 4.3a1.6 1.6 0 1 1-3.2 0 1.6 1.6 0 0 1 3.2 0z"/>',
 finance:'<path d="M2 5h20v4H2V5zm0 6h20v8H2v-8zm3 3h6v2H5v-2z"/>',
 chimera:'<path d="M12 2l8 3v6.2C20 16.4 16.6 20.8 12 22c-4.6-1.2-8-5.6-8-10.8V5l8-3zm-1 6v6h2V8h-2zm0 8v2h2v-2h-2z"/>',
 ai:'<path d="M9 1h2v2h2V1h2v2h1a2 2 0 0 1 2 2v1h2v2h-2v2h2v2h-2v2h2v2h-2v1a2 2 0 0 1-2 2h-1v2h-2v-2h-2v2H9v-2H8a2 2 0 0 1-2-2v-1H4v-2h2v-2H4v-2h2V8H4V6h2V5a2 2 0 0 1 2-2h1V1zm0 8v6h6V9H9z"/>',
 management:'<path d="M4 20V9h4v11H4zm6 0V3h4v17h-4zm6 0v-8h4v8h-4z"/>',
 catalog:'<path d="M3 4h18v3H3V4zm0 6.5h18v3H3v-3zM3 17h18v3H3v-3z"/>',
 settings:'<path d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7zM21 12l-1.9-1.1.3-2.2-2.1-.9-1.1-1.9-2.2.4L12 3l-1.6 1.6-2.2-.4L7.1 6.1l-2.1.9.3 2.2L3 12l1.9 1.1-.3 2.2 2.1.9 1.1 1.9 2.2-.4L12 21l1.6-1.6 2.2.4 1.1-1.9 2.1-.9-.3-2.2L21 12z"/>'
};
const ic=(n,s=17)=>'<svg viewBox="0 0 24 24" width="'+s+'" height="'+s+'" fill="currentColor">'+(ICONS[n]||'')+'</svg>';

/* ---------- утилиты ---------- */
const $=s=>document.querySelector(s);
const money=n=>Math.round(n).toLocaleString('ru-RU')+' ₸';
const num=n=>Math.round(n).toLocaleString('ru-RU');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick=a=>a[Math.floor(Math.random()*a.length)];
const nowTime=()=>{const d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')+':'+String(d.getSeconds()).padStart(2,'0')};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

function toast(msg,type='ok'){
  const el=document.createElement('div');
  el.className='toast '+(type==='ok'?'':type);
  el.innerHTML=msg;
  $('#toast-root').appendChild(el);
  setTimeout(()=>{el.style.transition='.3s';el.style.opacity='0';el.style.transform='translateX(20px)';setTimeout(()=>el.remove(),300)},3600);
}

/* ============================================================
   МОК-ДАННЫЕ
   ============================================================ */
const ROOM_TYPES={
  'Standard':{price:38000,cap:2},'Superior Twin':{price:48000,cap:2},
  'Deluxe King':{price:64000,cap:2},'Junior Suite':{price:92000,cap:3},'Panorama Suite':{price:145000,cap:4}
};
const FIRST=['Иван','Анна','Михаил','Ольга','Сергей','Айгуль','Данияр','Елена','Тимур','Мария','Азамат','Дина','Руслан','Наталья','Ержан','Камила','Виктор','Асель','Нурлан','Светлана'];
const LAST=['Петров','Смирнова','Ким','Иванова','Николаев','Сатпаева','Ахметов','Волкова','Бекжанов','Орлова','Жумабаев','Сулейменова','Дюсенов','Крылова','Абдрахманов','Ergaliyeva','Соколов','Нурланова','Тлеубаев','Морозова'];
const COUNTRIES=['Казахстан','Казахстан','Казахстан','Россия','Китай','Турция','ОАЭ','Германия','Узбекистан','Южная Корея'];
const COMPANIES=['ТОО «КазМунайИнжиниринг»','АО «Транском»','ТОО «Алатау Строй»','АО «Народный Банк»','ТОО «DigitalKZ»','АО «Каспий Логистик»','ТОО «Астана Медиа»'];

const state={
  role:'admin', view:'dashboard', navFilter:'',
  today:'15.08.2026',
  rooms:[], guests:[], bookings:[], folios:{}, tasks:[], keyLog:[], docs:[],
  alerts:[], activity:[], spaAppts:[], poolSessions:[], tables:[], orders:[],
  stock:[], engReqs:[], laundry:[], eqonaq:[], corporates:[], campaigns:[],
  clickerLog:[], clickerBusy:false,
  counters:{docsIssued:0, keysIssued:0, checkins:0},
  wizard:null, subview:{}
};

/* --- номера: 3 этажа × 20 --- */
(function buildRooms(){
  const types=['Standard','Standard','Superior Twin','Deluxe King','Junior Suite','Panorama Suite'];
  for(let f=1;f<=3;f++){
    for(let i=1;i<=20;i++){
      const no=f*100+i;
      let type = i>18 ? 'Panorama Suite' : i>15 ? 'Junior Suite' : i>10 ? 'Deluxe King' : i>5 ? 'Superior Twin' : 'Standard';
      state.rooms.push({no,floor:f,type,price:ROOM_TYPES[type].price,status:'free',guest:null,keys:[],clean:'clean',lock:{online:true,opens:rnd(0,9)}});
    }
  }
})();

/* --- заселяем 52 из 60 --- */
(function seedOccupancy(){
  const shuffled=[...state.rooms].sort(()=>Math.random()-0.5);
  const occ=shuffled.slice(0,44), cleaning=shuffled.slice(44,50), repair=shuffled.slice(50,53), vip=shuffled.slice(53,56);
  let gid=1;
  const mk=(room,vipFlag)=>{
    const name=pick(FIRST)+' '+pick(LAST);
    const country=vipFlag?pick(['ОАЭ','Китай','Турция']):pick(COUNTRIES);
    const corp=Math.random()<0.42?pick(COMPANIES):null;
    const nights=rnd(1,6);
    const g={id:'G-'+String(gid++).padStart(4,'0'),name,country,doc:(country==='Казахстан'?'Удостоверение личности':'Паспорт')+' '+String(rnd(100000000,999999999)),
      phone:'+7 7'+rnd(10,79)+' '+rnd(100,999)+'-'+rnd(10,99)+'-'+rnd(10,99),
      room:room.no,checkIn:'1'+rnd(0,4)+'.08.2026',checkOut:'1'+rnd(6,9)+'.08.2026',nights,
      company:corp,vip:!!vipFlag,loyalty:pick(['—','Silver','Gold','Platinum']),
      channel:pick(['Booking.com','Trip.com','Прямая бронь','Ostrovok','Корпоративный договор','Airbnb']),
      stays:rnd(1,9),docScan:true,eqonaq:country!=='Казахстан'?pick(['sent','pending']):null};
    state.guests.push(g);
    room.status=vipFlag?'vip':'occupied'; room.guest=g.id;
    room.keys=[{id:'CARD-'+rnd(10000,99999),issued:g.checkIn,until:g.checkOut,type:'Основная'}];
    state.folios[g.id]={items:[
      {zone:'Проживание',name:room.type+' × '+nights+' ноч.',sum:room.price*nights,time:'заезд'},
    ],limit:250000};
    if(Math.random()<0.55) state.folios[g.id].items.push({zone:'Ресторан',name:'Ужин, стол 12',sum:rnd(8,26)*1000,time:'20:'+rnd(10,59)});
    if(Math.random()<0.32) state.folios[g.id].items.push({zone:'SPA',name:pick(['Массаж классический 60 мин','Хаммам-программа','Стоун-терапия']),sum:rnd(14,34)*1000,time:'16:'+rnd(10,59)});
    if(Math.random()<0.25) state.folios[g.id].items.push({zone:'Бассейн',name:'Сеанс аквазоны',sum:5000,time:'11:30'});
    if(Math.random()<0.18) state.folios[g.id].items.push({zone:'Трансфер',name:'Аэропорт → отель',sum:9000,time:'заезд'});
  };
  occ.forEach(r=>mk(r,false)); vip.forEach(r=>mk(r,true));
  cleaning.forEach(r=>{r.status='cleaning';r.clean='dirty'});
  repair.forEach(r=>{r.status='repair'});
})();

/* --- брони на сегодня --- */
(function seedBookings(){
  const chans=['Booking.com','Trip.com','Ostrovok','Прямая бронь','Airbnb','Корпоративный договор','Expedia'];
  for(let i=0;i<14;i++){
    const type=pick(Object.keys(ROOM_TYPES));
    const nights=rnd(1,5);
    const country=pick(COUNTRIES);
    state.bookings.push({
      id:'BK-'+rnd(10000,99999), guest:pick(FIRST)+' '+pick(LAST), type, nights, country,
      channel:pick(chans), status:'expected', arrival:'15.08.2026', departure:'1'+rnd(6,9)+'.08.2026',
      sum:ROOM_TYPES[type].price*nights, guests:rnd(1,3), company:Math.random()<0.4?pick(COMPANIES):null,
      note:pick(['','Ранний заезд ~11:00','Просит высокий этаж','Трансфер из аэропорта','Детская кроватка','Тихий номер'])
    });
  }
  for(let i=0;i<9;i++){
    const type=pick(Object.keys(ROOM_TYPES));
    state.bookings.push({id:'BK-'+rnd(10000,99999),guest:pick(FIRST)+' '+pick(LAST),type,nights:rnd(2,7),country:pick(COUNTRIES),
      channel:pick(chans),status:'future',arrival:'1'+rnd(6,9)+'.08.2026',departure:'2'+rnd(0,5)+'.08.2026',
      sum:ROOM_TYPES[type].price*rnd(2,7),guests:rnd(1,4),company:null,note:''});
  }
})();

/* --- housekeeping --- */
(function seedTasks(){
  const maids=['Гульнара А.','Айжан С.','Мария К.','Сауле Т.','Нина В.'];
  state.rooms.filter(r=>r.status==='cleaning').forEach(r=>{
    state.tasks.push({room:r.no,maid:pick(maids),type:'Выездная уборка',status:'in_progress',min:rnd(20,45),checklist:false});
  });
  state.rooms.filter(r=>r.status==='occupied').slice(0,13).forEach(r=>{
    state.tasks.push({room:r.no,maid:pick(maids),type:'Текущая уборка',status:pick(['done','done','pending','inspect']),min:rnd(15,30),checklist:Math.random()<0.8});
  });
})();

/* --- SPA --- */
const SPA_SERVICES=[

function buildNav(){
  let h='';
  MODULES.forEach(g=>{
    const items=g.items.filter(i=>!i.roles||i.roles.includes(state.role));
    if(!items.length) return;
    h+='<div class="nav-group">'+g.group+'</div>';
    items.forEach(i=>{
      const b=i.badge?i.badge():0;
      h+='<button class="nav-item'+(state.view===i.id?' active':'')+'" onclick="go(\''+i.id+'\')">'+ic(i.icon)+
         '<span>'+i.name+'</span>'+(b?'<span class="nav-badge'+(i.alert?' alert':'')+'">'+b+'</span>':'')+'</button>';
    });
  });
  $('#nav').innerHTML=h;
}
function buildRoles(){
  $('#role-switch').innerHTML=Object.keys(ROLES).map(r=>
    '<button class="'+(state.role===r?'on':'')+'" onclick="setRole(\''+r+'\')">'+ROLES[r].label+'</button>').join('');
  const r=ROLES[state.role];
  $('#user-name').textContent=r.user; $('#user-role').textContent=r.sub; $('#user-initials').textContent=r.ini;
}
function setRole(r){
  state.role=r;
  if(r==='admin'&&state.view==='management') state.view='dashboard';
  buildRoles();buildNav();render();
  toast('Режим: <b>'+ROLES[r].label+'</b>. Состав панелей и права изменены.','info');
}
function go(v){
  state.view=v; state.subview={};
  document.getElementById('sidebar').classList.remove('open');
  buildNav();render();window.scrollTo({top:0});
}
function render(){
  const t=TITLES[state.view]||['',''];

  $('#view').innerHTML=(VIEWS[state.view]||(()=>'<div class="empty">Раздел в разработке</div>'))();
  buildNav();
}

/* ============================================================
   ГРАФИКИ (SVG вручную, без библиотек)
   ============================================================ */
function lineChart(vals,labels,h=180){
  const w=560,pad=30,max=Math.max(...vals)*1.15,min=0;
  const x=i=>pad+i*((w-pad*2)/(vals.length-1));
  const y=v=>h-24-((v-min)/(max-min))*(h-50);
  const pts=vals.map((v,i)=>[x(i),y(v)]);
  const path=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const area=path+' L'+x(vals.length-1)+' '+(h-24)+' L'+pad+' '+(h-24)+' Z';
  let g='';
  for(let i=0;i<4;i++){const gy=24+i*((h-50)/3);g+='<line x1="'+pad+'" y1="'+gy+'" x2="'+(w-pad)+'" y2="'+gy+'" stroke="#1B2740" stroke-width="1"/>';}
  return '<svg viewBox="0 0 '+w+' '+h+'" style="width:100%;height:auto" preserveAspectRatio="none">'+
    '<defs><linearGradient id="lg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3B82F6" stop-opacity=".35"/><stop offset="1" stop-color="#3B82F6" stop-opacity="0"/></linearGradient></defs>'+
    g+'<path d="'+area+'" fill="url(#lg)"/><path d="'+path+'" fill="none" stroke="#3B82F6" stroke-width="2.5" stroke-linejoin="round"/>'+
    pts.map((p,i)=>'<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="3.5" fill="#0E1626" stroke="#3B82F6" stroke-width="2"/>').join('')+
    labels.map((l,i)=>'<text x="'+x(i)+'" y="'+(h-6)+'" fill="#6D809F" font-size="10" text-anchor="middle">'+l+'</text>').join('')+
    '<text x="'+(w-pad)+'" y="18" fill="#E8EEF9" font-size="12" text-anchor="end" font-weight="600">'+vals[vals.length-1].toFixed(2)+'M ₸</text></svg>';
}
function donut(items,total,center1,center2){
  const R=54,C=2*Math.PI*R;let off=0;
  const arcs=items.map(it=>{
    const frac=it.value/total,len=frac*C;
    const s='<circle cx="70" cy="70" r="'+R+'" fill="none" stroke="'+it.color+'" stroke-width="18" stroke-dasharray="'+(len-2)+' '+(C-len+2)+'" stroke-dashoffset="'+(-off)+'" transform="rotate(-90 70 70)"/>';
    off+=len;return s;
  }).join('');
  return '<svg viewBox="0 0 140 140" width="140" height="140">'+
    '<circle cx="70" cy="70" r="'+R+'" fill="none" stroke="#1B2740" stroke-width="18"/>'+arcs+
    '<text x="70" y="66" text-anchor="middle" fill="#E8EEF9" font-size="17" font-weight="700">'+center1+'</text>'+
    '<text x="70" y="84" text-anchor="middle" fill="#6D809F" font-size="10">'+center2+'</text></svg>';
}
function ring(pct,label,color='#22C55E',size=110){
  const R=44,C=2*Math.PI*R;
  return '<svg viewBox="0 0 110 110" width="'+size+'" height="'+size+'">'+
   '<circle cx="55" cy="55" r="'+R+'" fill="none" stroke="#1B2740" stroke-width="11"/>'+
   '<circle cx="55" cy="55" r="'+R+'" fill="none" stroke="'+color+'" stroke-width="11" stroke-linecap="round" stroke-dasharray="'+(C*pct/100)+' '+C+'" transform="rotate(-90 55 55)"/>'+
   '<text x="55" y="52" text-anchor="middle" fill="#E8EEF9" font-size="19" font-weight="700">'+pct+'%</text>'+
   '<text x="55" y="68" text-anchor="middle" fill="#6D809F" font-size="9">'+label+'</text></svg>';
}
function barsH(items,maxOverride){
  const max=maxOverride||Math.max(...items.map(i=>i.value));
  return '<div class="stack" style="gap:11px">'+items.map(i=>
    '<div><div class="row-between" style="margin-bottom:5px"><span style="font-size:12.5px">'+i.label+'</span>'+
    '<b style="font-size:12.5px">'+(i.fmt||num)(i.value)+'</b></div>'+
    '<div class="progress"><i style="width:'+Math.max(3,i.value/max*100)+'%;background:'+(i.color||'#3B82F6')+'"></i></div></div>').join('')+'</div>';
}

   ============================================================ */
const CN={sys:'门锁管理系统',make:'制卡',read:'读卡',cancel:'注销',master:'总卡',room:'房间号',in:'入住日期',out:'退房日期',
  place:'请放置卡片',ok:'制卡成功',err:'读卡失败',guest:'客人姓名',type:'卡片类型',save:'保存',exit:'退出'};
function clickerSteps(room,until,mode){
  const label=mode==='cancel'?'аннулировать':mode==='master'?'мастер-карта':mode==='extra'?'дополнительная карта':'выдать ключ';
  return [
   {ru:'Команда из OPERELLE: '+label+', номер '+room,cls:'inf',hi:null},
   {ru:'Локальный агент (Windows): соединение с ПО замков «'+CN.sys+'»',cls:'t',hi:'sys'},
   {ru:'UI-автоматизация: открыт экран «'+CN.make+'» (кодирование карты)',cls:'t',hi:'make'},
   {ru:'Ввод полей: '+CN.room+'='+room+' · '+CN.in+'=15.08.2026 · '+CN.out+'='+until,cls:'t',hi:'fields'},
   {ru:'Экран энкодера: «'+CN.place+'» — положите карту',cls:'warn',hi:'place'},
   {ru:'OCR распознал китайский экран: «'+CN.ok+'» — карта закодирована',cls:'ok',hi:'ok'},
   {ru:'Считаны данные карты и срок действия',cls:'ok',hi:'ok'},
   {ru:'Синхронизация с OPERELLE: ключ привязан к проживанию',cls:'ok',hi:null},
   {ru:'CHIMERA: скриншот и запись операции сохранены в аудит-трейл',cls:'inf',hi:null}
  ];
}
async function runClicker(mode){
  const w=state.wizard;
  if(state.clickerBusy) return;
  state.clickerBusy=true;
  const room=w.room?w.room.no:'—', until='1'+Math.min(9,5+w.nights)+'.08.2026';
  const steps=clickerSteps(room,until,mode);
  w.keyLog=[];
  renderWizardBody();
  for(let i=0;i<steps.length;i++){
    await sleep(430);
    w.keyLog.push('<div><span class="t">'+nowTime()+'</span> <span class="'+steps[i].cls+'">'+steps[i].ru+'</span></div>');
    const log=$('#wiz-log'); if(log){log.innerHTML=w.keyLog.join('');log.scrollTop=log.scrollHeight}
  }
  const card='CARD-'+rnd(10000,99999);
  if(mode==='extra'){ toast('Дополнительная карта <b>'+card+'</b> закодирована.','ok'); }
  else { w.key=card; }
  state.clickerBusy=false;
  renderWizardBody();
  toast('Кликер: операция выполнена, карта '+card,'ok');
}

function finishCheckin(){
  const w=state.wizard;
  const g={id:'G-'+String(state.guests.length+1).padStart(4,'0'),name:w.guest.name,country:w.guest.country,
    doc:w.guest.docType+' '+w.guest.docNo,phone:w.guest.phone,room:w.room.no,checkIn:'15.08.2026',
    checkOut:'1'+Math.min(9,5+w.nights)+'.08.2026',nights:w.nights,company:w.guest.company||null,vip:false,
    loyalty:'—',channel:w.booking?w.booking.channel:'Прямая бронь (ресепшн)',stays:1,docScan:true,
    eqonaq:w.guest.country!=='Казахстан'?'pending':null};
  state.guests.push(g);
  const r=w.room;
  r.status='occupied'; r.guest=g.id; r.clean='clean';
  r.keys=[{id:w.key,issued:'15.08.2026',until:g.checkOut,type:'Основная'}];
  state.folios[g.id]={limit:w.pay.limit,items:[
    {zone:'Проживание',name:r.type+' × '+w.nights+' ноч.',sum:r.price*w.nights,time:nowTime().slice(0,5)},
    {zone:'Сборы',name:'Городской сбор',sum:1000*w.nights,time:nowTime().slice(0,5)}
  ]};
  if(w.booking) w.booking.status='checked_in';
  state.counters.checkins++; state.counters.keysIssued++;
  const t=nowTime().slice(0,5);
  const dl=[];
  if(w.docs.reg) dl.push('Регистрационная карта');
  if(w.docs.pdn) dl.push('Согласие на обработку ПДн');
  if(w.docs.contract) dl.push('Договор оказания услуг');
  if(w.docs.invoice) dl.push('Счёт на оплату');
  if(w.docs.act) dl.push('Акт оказанных услуг');
  if(w.docs.esf) dl.push('Счёт-фактура (ЭСФ)');
  if(w.docs.spravka) dl.push('Справка о проживании');
  dl.forEach(n=>state.docs.push({time:t,name:n,to:g.company||g.name,sum:n.indexOf('Счёт')===0||n.indexOf('Акт')===0?r.price*w.nights:0,guest:g.id}));
  state.counters.docsIssued+=dl.length;
  state.activity.unshift({type:'Заезд',text:'Номер '+r.no+' — '+g.name+', ключ '+w.key+' выдан',time:t,color:'green'});
  if(g.eqonaq==='pending') state.activity.unshift({type:'eQonaq',text:'Уведомление подготовлено: '+g.name+' ('+g.country+')',time:t,color:'amber'});
  closeModal(); state.subview.tab='inhouse'; render();
  toast('Заезд оформлен: <b>'+g.name+'</b>, номер '+r.no+'. Выпущено документов: '+dl.length+'.','ok');
  if(g.company) setTimeout(()=>toast('Командировочный пакет отправлен в бухгалтерию «'+g.company+'».','info'),900);
}

function openTable(no){
  const t=state.tables.find(x=>x.no===no);
  if(!t.items) t.items=[];
  const cats=Object.keys(MENU);
  const sum=t.items.reduce((s,i)=>s+i.p*i.q,0)+t.sum;
  openModal(mHead('Стол '+t.no+' · '+t.zone,(t.status==='busy'?'Открыт '+t.opened+(t.room?' · перенос на номер '+t.room:''):'Свободен — можно открыть счёт'))+
  '<div class="modal-body"><div class="grid g2">'+
   '<div><div class="label" style="margin-bottom:8px">Меню</div>'+cats.map(c=>
     '<div style="margin-bottom:10px"><div class="mini" style="margin-bottom:5px">'+c+'</div>'+
     MENU[c].map(m=>'<button class="tile click" style="width:100%;text-align:left;margin-bottom:5px" onclick="addDish('+no+',\''+esc(m.n)+'\','+m.p+')">'+
       '<div class="row-between"><span style="font-size:12.5px">'+m.n+'</span><b class="nowrap">'+money(m.p)+'</b></div></button>').join('')+'</div>').join('')+
   '</div>'+
   '<div><div class="label" style="margin-bottom:8px">Текущий счёт</div>'+
    '<div class="card" style="background:var(--card-2)">'+
    (t.sum?'<div class="kv"><span>Ранее пробито</span><b>'+money(t.sum)+'</b></div>':'')+
    (t.items.length?t.items.map(i=>'<div class="kv"><span>'+i.n+' × '+i.q+'</span><b>'+money(i.p*i.q)+'</b></div>').join(''):
      (t.sum?'':'<div class="empty" style="padding:18px">Добавьте позиции из меню</div>'))+
    '<div class="divider"></div><div class="row-between"><span style="font-size:15px">Итого</span><b style="font-size:19px">'+money(sum)+'</b></div></div>'+
    '<div class="stack" style="margin-top:12px">'+
     '<button class="btn btn-p" onclick="chargeTable('+no+',\'room\')">Перенести на номер гостя</button>'+
     '<button class="btn btn-g" onclick="chargeTable('+no+',\'cash\')">Оплатить и закрыть счёт</button>'+
    '</div></div>'+
  '</div></div>','wide');
}
function addDish(no,name,price){
  const t=state.tables.find(x=>x.no===no);
  if(!t.items)t.items=[];
  const ex=t.items.find(i=>i.n===name);
  if(ex)ex.q++;else t.items.push({n:name,p:price,q:1});
  t.status='busy';if(!t.opened)t.opened='только что';
  openTable(no);
}
function chargeTable(no,mode){
  const t=state.tables.find(x=>x.no===no);
  const sum=(t.items||[]).reduce((s,i)=>s+i.p*i.q,0)+t.sum;
  if(!sum){toast('Счёт пуст — добавьте позиции.','warn');return}
  if(mode==='room'){
    const g=state.guests.find(x=>x.room===t.room)||pick(inHouse());
    if(!g){toast('Нет заселённого гостя для переноса счёта.','warn');return}
    const f=state.folios[g.id];
    if(folioSum(g.id)+sum>f.limit){toast('Превышен лимит фолио гостя — требуется подтверждение администратора.','warn');}
    f.items.push({zone:'Ресторан',name:'Счёт, стол '+t.no,sum:sum,time:nowTime().slice(0,5)});
    state.activity.unshift({type:'Ресторан',text:'Стол '+t.no+' — счёт '+money(sum)+' перенесён на номер '+g.room,time:nowTime().slice(0,5),color:'blue'});
    toast('Счёт '+money(sum)+' перенесён на номер '+g.room+' ('+g.name+').','ok');
  } else {
    toast('Счёт '+money(sum)+' оплачен, фискальный чек пробит.','ok');
  }
  t.items=[];t.sum=0;t.status='free';t.guest=null;t.room=null;t.opened=null;
  closeModal();render();
}

async function runKeyOp(mode){
  const k=state.kclick;
  if(k.busy) return;
  k.busy=true;k.mode=mode;k.log=[];k.card=null;
  const steps=clickerSteps(k.room,'19.08.2026',mode);
  render();
  for(let i=0;i<steps.length;i++){
    k.step=i;
    await sleep(430);
    k.log.push('<div><span class="t">'+nowTime()+'</span> <span class="'+steps[i].cls+'">'+steps[i].ru+'</span></div>');
    if(i===6) k.card='CARD-'+rnd(10000,99999);
    const m=$('#mirror'); if(m) m.innerHTML=mirrorHTML();
    const l=$('#klog'); if(l){l.innerHTML=k.log.join('');l.scrollTop=l.scrollHeight}
  }
  const r=state.rooms.find(x=>x.no===k.room);
  if(mode==='cancel'){ if(r) r.keys=[]; toast('Карта номера '+k.room+' аннулирована.','ok'); }
  else if(mode==='master'){ toast('Мастер-карта закодирована и выдана службе.','ok'); }
  else { if(r) r.keys=[{id:k.card,issued:'15.08.2026',until:'19.08.2026',type:mode==='recode'?'Перекодирована':'Основная'}];
         state.counters.keysIssued++; toast('Готово: карта '+k.card+' для номера '+k.room+'.','ok'); }
  state.activity.unshift({type:'Замки',text:'Кликер: '+({issue:'выдача',recode:'перекодирование',cancel:'аннулирование',master:'мастер-карта'})[mode]+', номер '+k.room,time:nowTime().slice(0,5),color:'cyan'});
  k.busy=false;k.step=-1;
  setTimeout(()=>render(),700);
}

/* --- генерация броней на весь год с сезонностью --- */
(function buildReservations(){
  const SEASON=[0.56,0.60,0.66,0.71,0.78,0.86,0.90,0.92,0.83,0.74,0.64,0.80];
  const chans=['Booking.com','Trip.com','Ostrovok','Прямая бронь','Airbnb','Корпоративный договор','Expedia','Яндекс Путешествия'];
  let id=1;
  state.rooms.forEach(r=>{
    let d=new Date(YEAR,0,1);
    const end=new Date(YEAR,11,31);
    while(d<=end){
      const target=SEASON[d.getMonth()];
      const nights=rnd(1,6);
      const to=addD(d,nights);
      if(d>end) break;
      const rate=Math.round(r.price*(0.66+Math.random()*0.20)/100)*100;
      state.res.push({id:'RS-'+String(id++).padStart(5,'0'),room:r.no,guest:pick(FIRST)+' '+pick(LAST),
        from:dkey(d),to:dkey(to),nights,type:r.type,channel:pick(chans),rate,sum:rate*nights,
        company:Math.random()<0.35?pick(COMPANIES):null});
      const gap=Math.max(0,Math.round(nights*(1-target)/target+(Math.random()-0.5)*1.2));
      d=addD(to,gap);
    }
  });
})();

/* --- синхронизация с фактическим состоянием на сегодня --- */
(function syncToday(){
  const covers=(x,k)=>x.from<=k&&x.to>k;
  state.rooms.forEach(r=>{
    const g=r.guest?guestById(r.guest):null;
    if(g){
      const ci=g.checkIn.split('.'), co=g.checkOut.split('.');
      const from=ci[2]+'-'+ci[1]+'-'+ci[0], to=co[2]+'-'+co[1]+'-'+co[0];
      state.res=state.res.filter(x=>x.room!==r.no||!(x.from<to&&x.to>from));
      state.res.push({id:'RS-'+r.no+'-NOW',room:r.no,guest:g.name,from,to,
        nights:g.nights,type:r.type,channel:g.channel,rate:r.price,sum:r.price*g.nights,company:g.company,live:true});
    } else {
      state.res=state.res.filter(x=>x.room!==r.no||!(covers(x,TKEY)&&x.from<TKEY));
    }
  });
  state.res.sort((a,b)=>a.room-b.room||a.from.localeCompare(b.from));
  /* индекс по дням */
  state.res.forEach(x=>{
    let d=dparse(x.from);const to=dparse(x.to);
    const price=x.rate||(state.rooms.find(r=>r.no===x.room)||{price:48000}).price;
    while(d<to){
      const k=dkey(d);
      const s=state.dayIdx[k]||(state.dayIdx[k]={occ:0,rev:0,arr:0,dep:0});
      s.occ++;s.rev+=price;
      if(k===x.from)s.arr++;
      d=addD(d,1);
    }
    const s2=state.dayIdx[x.to]||(state.dayIdx[x.to]={occ:0,rev:0,arr:0,dep:0});
    s2.dep++;
  });
})();

const dayStat=k=>{const s=state.dayIdx[k]||{occ:0,rev:0,arr:0,dep:0};
  return{occ:s.occ,free:60-s.occ,pct:Math.round(s.occ/60*100),rev:s.rev,arr:s.arr,dep:s.dep,
    adr:s.occ?Math.round(s.rev/s.occ):0,revpar:Math.round(s.rev/60)}};
function monthStat(m,y){
  const days=new Date(y,m+1,0).getDate();let occ=0,rev=0,arr=0,dep=0;
  for(let i=1;i<=days;i++){const s=state.dayIdx[dkey(new Date(y,m,i))]||{occ:0,rev:0,arr:0,dep:0};
    occ+=s.occ;rev+=s.rev;arr+=s.arr;dep+=s.dep}
  return{days,occ,rev,arr,dep,pct:Math.round(occ/(60*days)*100),adr:occ?Math.round(rev/occ):0,revpar:Math.round(rev/(60*days))};
}
const resOn=(room,k)=>state.res.find(x=>x.room===room&&x.from<=k&&x.to>k);
const nextRes=(room,k)=>state.res.filter(x=>x.room===room&&x.from>=k).sort((a,b)=>a.from.localeCompare(b.from))[0];
const resState=x=>x.to<=TKEY?'past':(x.from<=TKEY&&x.to>TKEY?'stay':'book');

/* --- навигация --- */
function calMode(m){state.cal.mode=m;render()}
function calShift(n){
  const c=state.cal;
  if(c.mode==='today'){c.date=dkey(addD(dparse(c.date),n))}
  if(c.mode==='days'){c.from=dkey(addD(dparse(c.from),n*c.days))}
  if(c.mode==='month'){let m=c.month+n;if(m<0){m=11}if(m>11){m=0}c.month=m}
  render();
}
function calToday(){state.cal.date=TKEY;state.cal.from=TKEY;state.cal.month=7;render()}
function calOpenDay(k){state.cal.date=k;state.cal.mode='today';render()}
function calOpenMonth(m){state.cal.month=m;state.cal.mode='month';render()}
function calSetDays(n){state.cal.days=n;render()}
function openRes(id){
  const x=state.res.find(r=>r.id===id);if(!x)return;
  const st=resState(x);
  openModal(mHead('Бронь '+x.id+' · номер '+x.room,x.type+' · '+x.channel)+
  '<div class="modal-body"><div class="grid g2">'+
   '<div class="card" style="background:var(--card-2)">'+
    '<div class="kv"><span>Гость</span><b>'+esc(x.guest)+'</b></div>'+
    '<div class="kv"><span>Заезд</span><b>'+dfmt(dparse(x.from))+'</b></div>'+
    '<div class="kv"><span>Выезд</span><b>'+dfmt(dparse(x.to))+'</b></div>'+
    '<div class="kv"><span>Ночей</span><b>'+x.nights+'</b></div>'+
    '<div class="kv"><span>Статус</span><b>'+(st==='stay'?'Проживает':st==='past'?'Выехал':'Забронировано')+'</b></div></div>'+
   '<div class="card">'+
    '<div class="kv"><span>Категория</span><b>'+x.type+'</b></div>'+
    '<div class="kv"><span>Канал</span><b>'+x.channel+'</b></div>'+
    '<div class="kv"><span>Компания</span><b>'+(x.company||'—')+'</b></div>'+
    '<div class="kv"><span>Сумма</span><b>'+money(x.sum)+'</b></div>'+
    '<div class="kv"><span>Средняя за ночь</span><b>'+money(x.sum/x.nights)+'</b></div></div>'+
  '</div></div>'+
  '<div class="modal-foot"><button class="btn" onclick="closeModal()">Закрыть</button>'+
   (st==='book'?'<button class="btn btn-g" onclick="closeModal();startCheckin()">Оформить заезд</button>':'')+
   '<button class="btn btn-p" onclick="closeModal();openRoom('+x.room+')">Карточка номера</button></div>','wide');
}

/* --- представление --- */
VIEWS.calendar=()=>{
  const c=state.cal;
  const tab=(id,l)=>'<button class="'+(c.mode===id?'on':'')+'" onclick="calMode(\''+id+'\')">'+l+'</button>';
  const nav='<div class="row" style="gap:8px;flex-wrap:wrap;margin-bottom:14px">'+
    '<div class="tabs">'+tab('today','Сегодня')+tab('days','По дням')+tab('month','Месяц')+tab('year','Год')+'</div>'+
    (c.mode!=='year'?'<button class="btn btn-sm" onclick="calShift(-1)">←</button>'+
      '<button class="btn btn-sm" onclick="calToday()">Сегодня</button>'+
      '<button class="btn btn-sm" onclick="calShift(1)">→</button>':'')+
    (c.mode==='days'?'<div class="tabs" style="margin-left:auto">'+[7,14,30].map(n=>
      '<button class="'+(c.days===n?'on':'')+'" onclick="calSetDays('+n+')">'+n+' дн.</button>').join('')+'</div>':'')+
    '</div>';

  /* ---------- СЕГОДНЯ ---------- */
  if(c.mode==='today'){
    const k=c.date, d=dparse(k), isNow=k===TKEY;
    const st0=stats();
    const s=isNow?{occ:st0.occ,free:st0.free,pct:st0.load,rev:dayStat(k).rev,arr:arrivals().length,dep:departures().length}:dayStat(k);
    let floors='';
    for(let f=1;f<=3;f++){
      floors+='<div class="card" style="margin-bottom:14px"><div class="card-head"><div class="card-title">Этаж '+f+'</div>'+
        '<div class="card-actions"><span class="badge b-green">свободно '+state.rooms.filter(r=>r.floor===f&&!resOn(r.no,k)&&r.status!=='repair').length+'</span></div></div>'+
        '<div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(184px,1fr));gap:10px">';
      state.rooms.filter(r=>r.floor===f).forEach(r=>{
        const x=resOn(r.no,k), nx=nextRes(r.no,k);
        let label,cls,color;
        if(isNow&&r.status==='repair'){label='Ремонт';cls='b-red';color='rgba(239,68,68,.09)'}
        else if(isNow&&r.status==='cleaning'){label='Уборка';cls='b-amber';color='rgba(245,158,11,.09)'}
        else if(x&&x.from<k){label='Заселён';cls='b-blue';color='rgba(59,130,246,.09)'}
        else if(x&&x.from===k){label='Заезд сегодня';cls='b-violet';color='rgba(168,85,247,.09)'}
        else {label='Свободен';cls='b-green';color='rgba(34,197,94,.07)'}
        floors+='<button class="tile click" style="text-align:left;background:'+color+'" onclick="'+(x?'openRes(\''+x.id+'\')':'openRoom('+r.no+')')+'">'+
          '<div class="row-between"><b style="font-size:16px">'+r.no+'</b><span class="badge '+cls+'">'+label+'</span></div>'+
          '<div style="margin:7px 0"><span class="badge b-slate">'+r.type+'</span></div>'+
          '<div class="mini">'+(x?esc(x.guest)+' · до '+dshort(dparse(x.to))
            :(nx?'следующая бронь: '+dfmt(dparse(nx.from)):'броней впереди нет'))+'</div></button>';
      });
      floors+='</div></div>';
    }
    return nav+
     '<div class="row-between" style="margin-bottom:14px;flex-wrap:wrap;gap:10px"><div>'+
      '<div class="label">Дата</div><div style="font-size:19px;font-weight:700">'+dfmt(d)+
      ' <span class="mini" style="font-weight:400">· '+WD[wdIdx(d)]+(isNow?' · сегодня':'')+'</span></div></div></div>'+
     '<div class="grid g-kpi" style="margin-bottom:14px">'+
      [['Свободно',s.free,'#22C55E'],['Занято',s.occ,'#3B82F6'],['Загрузка',s.pct+'%','#A855F7'],
       ['Заезды',s.arr,'#06B6D4'],['Выезды',s.dep,'#F59E0B'],['Выручка номерного фонда',money(s.rev),'#C9A227']]
      .map(([l,v,col])=>'<div class="card"><div class="label">'+l+'</div><div class="kpi-val" style="font-size:21px;color:'+col+'">'+v+'</div></div>').join('')+'</div>'+
     floors;
  }

  /* ---------- ПО ДНЯМ ---------- */
  if(c.mode==='days'){
    const start=dparse(c.from), n=c.days;
    const days=[];for(let i=0;i<n;i++)days.push(addD(start,i));
    const endK=dkey(addD(start,n));
    const win=state.res.filter(x=>x.from<endK&&x.to>dkey(start));
    const head='<div class="tl-head"><div class="tl-corner">Номер</div><div class="tl-days">'+
      days.map(d=>{const k=dkey(d),w=wdIdx(d)>4;
        return '<div class="tl-day'+(k===TKEY?' now':w?' we':'')+'"><b>'+String(d.getDate()).padStart(2,'0')+'</b>'+WD[wdIdx(d)]+'</div>'}).join('')+'</div></div>';
    const rows=state.rooms.map(r=>{
      let slots='';
      days.forEach((d,i)=>{const k=dkey(d);slots+='<i class="tl-slot'+(k===TKEY?' now':wdIdx(d)>4?' we':'')+'" style="grid-area:1/'+(i+1)+'"></i>'});
      let bars='';
      win.filter(x=>x.room===r.no).forEach(x=>{
        const f=dparse(x.from),t=dparse(x.to);
        let st=Math.round((f-start)/86400000), len=Math.round((t-f)/86400000);
        if(st<0){len+=st;st=0}
        if(st+len>n)len=n-st;
        if(len<=0)return;
        const s=resState(x);
        bars+='<b class="tl-bar bar-'+s+'" style="grid-area:1/'+(st+1)+'/2/span '+len+'" onclick="openRes(\''+x.id+'\')" '+
          'title="'+esc(x.guest)+' · '+dfmt(f)+'—'+dfmt(t)+' · '+x.channel+'">'+esc(x.guest)+'</b>';
      });
      return '<div class="tl-line"><div class="tl-room"><b>'+r.no+'</b><span>'+r.type+'</span></div>'+
        '<div class="tl-track">'+slots+bars+'</div></div>';
    }).join('');
    const totals=days.map(d=>dayStat(dkey(d)));
    const avg=Math.round(totals.reduce((a,x)=>a+x.pct,0)/n);
    return nav+
     '<div class="grid g-kpi" style="margin-bottom:14px">'+
      [['Период',dshort(start)+' — '+dshort(addD(start,n-1)),'#E8EEF9'],['Средняя загрузка',avg+'%','#3B82F6'],
       ['Проданных ночей',num(totals.reduce((a,x)=>a+x.occ,0)),'#A855F7'],
       ['Свободных ночей',num(totals.reduce((a,x)=>a+x.free,0)),'#22C55E'],
       ['Заездов',totals.reduce((a,x)=>a+x.arr,0),'#06B6D4'],
       ['Выручка периода',money(totals.reduce((a,x)=>a+x.rev,0)),'#C9A227']]
      .map(([l,v,col])=>'<div class="card"><div class="label">'+l+'</div><div class="kpi-val" style="font-size:18px;color:'+col+'">'+v+'</div></div>').join('')+'</div>'+
     '<div class="card" style="margin-bottom:14px"><div class="card-head"><div class="card-title">Занятость по дням</div>'+
      '<div class="card-actions"><span class="legend">'+
      [['rgba(59,130,246,.85)','проживает'],['rgba(245,158,11,.8)','бронь'],['rgba(100,116,139,.5)','выехал'],['transparent','свободно']]
      .map(([col,l])=>'<span><i style="background:'+col+';'+(col==='transparent'?'border:1px solid var(--line)':'')+'"></i>'+l+'</span>').join('')+
      '</span></div></div>'+
      '<div class="scroll-x"><div class="tl" style="--n:'+n+';min-width:'+(104+n*38)+'px">'+head+rows+'</div></div>'+
      '<div class="mini" style="margin-top:9px">Нажмите на полосу — карточка брони с гостем, каналом и суммой.</div></div>'+
     '<div class="card"><div class="card-head"><div class="card-title">Свободные номера по дням</div></div>'+
      '<div class="tbl-wrap"><table><thead><tr><th>Дата</th><th>День</th><th>Свободно</th><th>Занято</th><th>Загрузка</th><th>Заезды</th><th>Выезды</th><th>ADR</th><th>Выручка</th></tr></thead><tbody>'+
      days.map((d,i)=>{const s=totals[i],k=dkey(d);
        return '<tr'+(k===TKEY?' style="background:rgba(59,130,246,.08)"':'')+'><td><b>'+dfmt(d)+'</b></td><td class="mini">'+WD[wdIdx(d)]+'</td>'+
        '<td><b style="color:'+(s.free>0?'#7EE8AC':'#FCA5A5')+'">'+s.free+'</b></td><td>'+s.occ+'</td>'+
        '<td style="min-width:110px"><div class="row" style="gap:8px"><div class="progress" style="flex:1"><i style="width:'+s.pct+'%;background:'+(s.pct>90?'#EF4444':s.pct>70?'#3B82F6':'#22C55E')+'"></i></div><span class="mini">'+s.pct+'%</span></div></td>'+
        '<td>'+s.arr+'</td><td>'+s.dep+'</td><td class="mini">'+money(s.adr)+'</td><td>'+money(s.rev)+'</td></tr>'}).join('')+
      '</tbody></table></div></div>';
  }

  /* ---------- МЕСЯЦ ---------- */
  if(c.mode==='month'){
    const m=c.month, y=c.year, ms=monthStat(m,y);
    const first=new Date(y,m,1), lead=wdIdx(first), total=new Date(y,m+1,0).getDate();
    let cells='';
    for(let i=0;i<lead;i++)cells+='<div class="cal-day out"></div>';
    for(let i=1;i<=total;i++){
      const d=new Date(y,m,i),k=dkey(d),s=dayStat(k);
      const col=s.pct>90?'#EF4444':s.pct>75?'#F59E0B':s.pct>50?'#3B82F6':'#22C55E';
      cells+='<div class="cal-day'+(k===TKEY?' now':'')+'" onclick="calOpenDay(\''+k+'\')">'+
        '<div class="row-between"><span class="d">'+i+'</span><span class="mini">'+WD[wdIdx(d)]+'</span></div>'+
        '<div class="o">занято '+s.occ+' · '+s.pct+'%</div>'+
        '<div class="f" style="color:'+(s.free?'#7EE8AC':'#FCA5A5')+'">свободно '+s.free+'</div>'+
        '<div class="bar"><i style="width:'+s.pct+'%;background:'+col+'"></i></div></div>';
    }
    const weeks=[];let wk={n:0,occ:0,rev:0,days:0};
    for(let i=1;i<=total;i++){const d=new Date(y,m,i),s=dayStat(dkey(d));wk.occ+=s.occ;wk.rev+=s.rev;wk.days++;
      if(wdIdx(d)===6||i===total){wk.n=weeks.length+1;weeks.push({...wk});wk={n:0,occ:0,rev:0,days:0}}}
    return nav+
     '<div class="row-between" style="margin-bottom:14px;flex-wrap:wrap;gap:10px"><div>'+
      '<div class="label">Месяц</div><div style="font-size:19px;font-weight:700">'+MONTHS[m]+' '+y+'</div></div></div>'+
     '<div class="grid g-kpi" style="margin-bottom:14px">'+
      [['Средняя загрузка',ms.pct+'%','#3B82F6'],['Проданных ночей',num(ms.occ),'#A855F7'],
       ['Свободных ночей',num(60*ms.days-ms.occ),'#22C55E'],['Заездов',num(ms.arr),'#06B6D4'],
       ['ADR',money(ms.adr),'#C9A227'],['Выручка за месяц',money(ms.rev),'#E8EEF9']]
      .map(([l,v,col])=>'<div class="card"><div class="label">'+l+'</div><div class="kpi-val" style="font-size:19px;color:'+col+'">'+v+'</div></div>').join('')+'</div>'+
     '<div class="grid g-main">'+
      '<div class="card"><div class="card-head"><div class="card-title">Календарь занятости</div>'+
       '<div class="card-actions"><span class="mini">нажмите на день — раскладка по номерам</span></div></div>'+
       '<div class="cal-h">'+WD.map(w=>'<div>'+w+'</div>').join('')+'</div>'+
       '<div class="cal-grid" style="margin-top:6px">'+cells+'</div></div>'+
      '<div class="stack">'+
       '<div class="card"><div class="card-head"><div class="card-title">По неделям</div></div>'+
        barsH(weeks.map(w=>({label:'Неделя '+w.n+' ('+w.days+' дн.)',value:Math.round(w.occ/(60*w.days)*100),color:'#3B82F6',fmt:v=>v+'%'})),100)+'</div>'+
       '<div class="card"><div class="card-head"><div class="card-title">Категории номеров</div></div>'+
        (()=>{const by={};state.rooms.forEach(r=>{by[r.type]=by[r.type]||{n:0,occ:0}});
          state.rooms.forEach(r=>by[r.type].n++);
          for(let i=1;i<=total;i++){const k=dkey(new Date(y,m,i));
            state.rooms.forEach(r=>{if(resOn(r.no,k))by[r.type].occ++})}
          return barsH(Object.keys(by).map(t=>({label:t+' ('+by[t].n+' номеров)',
            value:Math.round(by[t].occ/(by[t].n*total)*100),color:'#A855F7',fmt:v=>v+'%'})),100)})()+
       '</div></div></div>';
  }

  /* ---------- ГОД ---------- */
  const y=c.year;
  const ms=[];for(let m=0;m<12;m++)ms.push(monthStat(m,y));
  const yOcc=ms.reduce((a,x)=>a+x.occ,0), yRev=ms.reduce((a,x)=>a+x.rev,0);
  const yDays=ms.reduce((a,x)=>a+x.days,0);
  const maxRev=Math.max(...ms.map(x=>x.rev));
  return nav+
   '<div class="row-between" style="margin-bottom:14px"><div><div class="label">Год</div>'+
    '<div style="font-size:19px;font-weight:700">'+y+' · Royal Palace Almaty</div></div></div>'+
   '<div class="grid g-kpi" style="margin-bottom:14px">'+
    [['Средняя загрузка за год',Math.round(yOcc/(60*yDays)*100)+'%','#3B82F6'],
     ['Проданных ночей',num(yOcc),'#A855F7'],['Свободных ночей',num(60*yDays-yOcc),'#22C55E'],
     ['ADR за год',money(yRev/yOcc),'#C9A227'],['RevPAR',money(yRev/(60*yDays)),'#06B6D4'],
     ['Выручка номерного фонда',(yRev/1000000).toFixed(1)+' млн ₸','#E8EEF9']]
    .map(([l,v,col])=>'<div class="card"><div class="label">'+l+'</div><div class="kpi-val" style="font-size:19px;color:'+col+'">'+v+'</div></div>').join('')+'</div>'+
   '<div class="card" style="margin-bottom:14px"><div class="card-head"><div class="card-title">Загрузка по месяцам</div>'+
    '<div class="card-actions"><span class="mini">нажмите на месяц — календарь занятости</span></div></div>'+
    '<div class="yr-grid">'+ms.map((s,m)=>{
      const col=s.pct>85?'#EF4444':s.pct>70?'#F59E0B':s.pct>55?'#3B82F6':'#22C55E';
      return '<div class="yr-card'+(m===7?' now':'')+'" onclick="calOpenMonth('+m+')">'+
       '<div class="row-between"><b style="font-size:13px">'+MONTHS[m]+'</b><span class="badge b-slate">'+s.pct+'%</span></div>'+
       '<div class="mini" style="margin:6px 0 3px">занято '+num(s.occ)+' · свободно '+num(60*s.days-s.occ)+'</div>'+
       '<div class="progress"><i style="width:'+s.pct+'%;background:'+col+'"></i></div>'+
       '<div class="mini" style="margin-top:7px">'+money(s.rev)+'</div></div>'}).join('')+'</div></div>'+
   '<div class="grid g-main">'+
    '<div class="card"><div class="card-head"><div class="card-title">Показатели по месяцам</div></div>'+
     '<div class="tbl-wrap"><table><thead><tr><th>Месяц</th><th>Загрузка</th><th>Продано ночей</th><th>Свободно ночей</th><th>Заезды</th><th>ADR</th><th>RevPAR</th><th>Выручка</th></tr></thead><tbody>'+
     ms.map((s,m)=>'<tr'+(m===7?' style="background:rgba(201,162,39,.08)"':'')+'><td><b>'+MONTHS[m]+'</b></td>'+
      '<td style="min-width:110px"><div class="row" style="gap:8px"><div class="progress" style="flex:1"><i style="width:'+s.pct+'%;background:'+(s.pct>85?'#EF4444':s.pct>70?'#F59E0B':'#3B82F6')+'"></i></div><span class="mini">'+s.pct+'%</span></div></td>'+
      '<td>'+num(s.occ)+'</td><td><b style="color:#7EE8AC">'+num(60*s.days-s.occ)+'</b></td><td>'+s.arr+'</td>'+
      '<td class="mini">'+money(s.adr)+'</td><td class="mini">'+money(s.revpar)+'</td><td><b>'+money(s.rev)+'</b></td></tr>').join('')+
     '<tr><td><b>Итого</b></td><td><b>'+Math.round(yOcc/(60*yDays)*100)+'%</b></td><td><b>'+num(yOcc)+'</b></td>'+
     '<td><b>'+num(60*yDays-yOcc)+'</b></td><td><b>'+num(ms.reduce((a,x)=>a+x.arr,0))+'</b></td>'+
     '<td class="mini">'+money(yRev/yOcc)+'</td><td class="mini">'+money(yRev/(60*yDays))+'</td><td><b>'+money(yRev)+'</b></td></tr>'+
     '</tbody></table></div></div>'+
